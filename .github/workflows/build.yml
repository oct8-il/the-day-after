# The site's CI: build, fidelity, performance, release. It reads data/ only as
# an input to the build - the ledger is checked by the `data` workflow.
#
# WHEN THIS RUNS
#   push to dev / staging / prod   always. The environment comes from the
#                                  branch name, and the promotion between the
#                                  three branches is a whole-branch
#                                  fast-forward, so every commit that can
#                                  become prod is built and compared.
#   pull request                   unless the only thing that changed is ledger
#                                  content or prose - see `paths-ignore:`.
#                                  data/schema/ and data/taxonomy.json are NOT
#                                  ignored: they are code the app compiles
#                                  against, not records.
#   workflow_dispatch              on demand, and the only way to recapture the
#                                  fidelity baselines.
#
# `data` and `build` are independent workflows and neither waits for the other.
# Require BOTH on dev, staging and prod in the branch protection rules.

name: build

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    paths-ignore:
      - 'data/live/**'
      - 'data/test/**'
      - '**/*.md'
      - '.github/workflows/data.yml'
  workflow_dispatch:
    inputs:
      capture_baselines:
        description: 'Recapture the fidelity baselines from the frozen prototype and commit them'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ------------------------------------------------------------------- build
  build:
    name: build
    runs-on: ubuntu-latest
    if: ${{ !inputs.capture_baselines }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # The environment comes from the branch name, which GITHUB_REF_NAME
      # already carries. Nothing to configure here or in Vercel.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: site, path: out/, retention-days: 7 }

  # ---------------------------------------------------------------- fidelity
  # Rule 3: every ported view is compared against the frozen prototype. The
  # baselines were captured on this same runner image with this same pinned
  # browser; that is why the comparison never runs on a laptop.
  fidelity:
    name: fidelity vs. prototype
    runs-on: ubuntu-latest
    needs: build
    if: ${{ !inputs.capture_baselines }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }
      - name: serve the exported site
        run: npm start & npx wait-on http://localhost:4173 -t 30000
      - name: compare
        run: npm run fidelity:app
        env:
          FIDELITY_BASE_URL: http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fidelity-diff, path: playwright-report/, retention-days: 14 }

  # Run by hand from the Actions tab. Captures the sixteen baselines from
  # docs/prototype.html and commits them, so the images in git were always made
  # by this runner and never by a machine with different fonts.
  baselines:
    name: capture baselines
    runs-on: ubuntu-latest
    if: ${{ inputs.capture_baselines }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fidelity:baseline
      - name: commit them
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests/fidelity/baseline
          git diff --cached --quiet && echo 'baselines unchanged' && exit 0
          git commit -m 'Fidelity baselines captured from prototype-v0.4-final'
          git push

  # ------------------------------------------------ performance, on staging
  lighthouse:
    name: Lighthouse, mobile
    runs-on: ubuntu-latest
    needs: [build, fidelity]
    if: github.ref_name == 'staging'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }
      - name: serve the exported site
        run: npm start & npx wait-on http://localhost:4173 -t 30000
      # The home page, not an item page: which items exist depends on what is
      # published, so naming one here would fail the moment it is not.
      - name: Lighthouse, mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:4173/
          configPath: ./.github/lighthouse.json
          uploadArtifacts: true

  # ------------------------------------------------------- release, on prod
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, fidelity]
    if: github.ref_name == 'prod'
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # The corrections page is the public record of what changed and when. It
      # is rendered from the history of data/, so it cannot drift from reality.
      - name: regenerate the corrections page
        run: node scripts/build-corrections.mjs || echo 'corrections generator lands in W4'
