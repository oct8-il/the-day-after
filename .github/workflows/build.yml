# The site's CI: build, fidelity, performance, release. It reads data/ only as
# an input to the build - the ledger itself is checked by the `data` workflow.
#
# WHEN THIS RUNS
#   Only when something the build actually consumes changed - see the `changes`
#   job, which is where the rule lives. Two things that look like data are not:
#
#     data/schema/ and data/taxonomy.json are code the app compiles against,
#     so they build.
#
#     data/test/ is what a dev build renders - dev reads the fixture pool
#     (next.config.mjs), so a fixture change changes the dev site and builds.
#
#   What is left out on dev is data/live: dev never renders the real ledger, so
#   a research pass that touches nothing but data/live cannot change what a dev
#   build produces. That is the case this rule exists for.
#
#   Two exemptions. Pushes to staging and prod always run everything - those
#   builds DO render data/live, and promotion is a whole-branch fast-forward,
#   so the commit that can become prod is verified whole. And a run started by
#   hand always runs; it is also the only way to recapture the baselines.
#
#   The rule is a job and not a `paths-ignore:` filter on purpose. A path
#   filter stops the workflow from starting at all, and a required check that
#   never starts stays pending forever; a job skipped by an `if:` reports green.
#
# `data` and `build` are independent workflows and neither waits for the other.
# Require BOTH on dev, staging and prod in the branch protection rules.

name: build

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_baselines:
        description: 'Recapture the fidelity baselines from the frozen prototype and commit them'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # ----------------------------------------------------------------- changes
  changes:
    name: does this change the site?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          run_it()  { echo 'run=true'  >> "$GITHUB_OUTPUT"; echo "running: $1";  exit 0; }
          skip_it() { echo 'run=false' >> "$GITHUB_OUTPUT"; echo "skipping: $1"; exit 0; }

          [ "$EVENT" = 'workflow_dispatch' ] && run_it 'started by hand'
          case "$BRANCH" in
            staging|prod) run_it 'promotion branch - this build renders data/live and can become prod' ;;
          esac

          if [ -n "$BASE" ]; then
            RANGE="origin/$BASE...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != '0000000000000000000000000000000000000000' ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            run_it 'no diff range to read - a new branch or a forced push'
          fi

          CHANGED=$(git diff --name-only "$RANGE")
          echo 'changed:'; echo "$CHANGED" | sed 's/^/  /'

          # Everything the build does not read: the real ledger (not rendered
          # on dev), prose, and the other workflow.
          REST=$(echo "$CHANGED" | grep -Ev '^data/live/|\.md$|^\.github/workflows/data\.yml$')
          [ -n "$REST" ] && run_it 'the site changed'

          skip_it 'data/live only - dev renders the fixture pool, so the site is unchanged'

  # -------------------------------------------------------------------- unit
  # The rules the deck composes from - which stages an item reached, what the
  # gate's source line names, which neighbours slide 6 shows - are pure
  # functions in lib/, and this is where they are held to their spec. They are
  # checked here rather than in the `data` workflow because they are code, not
  # ledger: a broken helper is a bug in the site, and it should not report as
  # an invalid record.
  #
  # A screenshot cannot see a rule. A baseline that goes red tells you a pixel
  # moved; this tells you which rule broke, three phases before the pixel.
  unit:
    name: the rules
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true' && !inputs.capture_baselines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npm test

  # ------------------------------------------------------------------- build
  build:
    name: build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run == 'true' && !inputs.capture_baselines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # The environment comes from the branch name, which GITHUB_REF_NAME
      # already carries. Nothing to configure here or in Vercel.
      #
      # The channels are the one exception, and they are set here rather than
      # left off on purpose. §8's rule is that nothing ships dead: with no
      # newsletter account slide 5's pill and its sheet are not drawn at all,
      # which is the shape a deployment has until Roy configures one - and a
      # shape with nothing in it is a shape the deck tests cannot test. So
      # this artifact, which is only ever served to the test jobs and never
      # deployed, is built as the configured shape. The username is deliberately
      # not a real list; the tests intercept the endpoint and nothing leaves.
      #
      # WHATSAPP_INVITE_URL is left unset, because that is genuinely where
      # DIA-446 stands: the tests assert that every row drawn has somewhere to
      # go, which holds in both shapes.
      - run: npm run build
        env:
          NEWSLETTER_USERNAME: ci-not-a-real-list
      - uses: actions/upload-artifact@v4
        with: { name: site, path: out/, retention-days: 7 }

  # -------------------------------------------------------------------- deck
  # §11: "Proof is a frozen set of 390x844 baselines, plus assertions on
  # measured geometry and on the gestures. Pixels cannot see a rule; rules
  # cannot see a screen." This is the second half - the geometry and the
  # gestures - and it runs against the same exported site the fidelity job
  # compares. The baselines are Phase 9.
  #
  # A dev build reads data/test, so the fixtures the spec addresses (t01) are
  # the ones in the artifact. Three of gate 1's six checks are not here and
  # cannot be: the iOS selection callout, the magnifier, and the footer under a
  # collapsing URL bar exist only on a phone.
  deck:
    name: the deck's geometry and gestures
    runs-on: ubuntu-latest
    needs: build
    if: needs.changes.outputs.run == 'true' && !inputs.capture_baselines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }
      - name: serve the exported site
        run: npm start & npx wait-on http://localhost:4173 -t 30000
      - name: assert
        run: npm run test:deck
        env:
          FIDELITY_BASE_URL: http://localhost:4173
      # ...and again against a development build. React's most useful warnings
      # - "Cannot update a component while rendering a different component"
      # among them - exist only in dev and are stripped from the export above,
      # so a deck that touches history inside a render is silently wrong in the
      # build this job just tested and loud in the one a reviewer runs. The
      # suite fails on anything written to the console, which is what catches
      # them. It cost a round of phone review to learn.
      - name: serve a development build
        run: npm run dev -- --port 3000 & npx wait-on http://localhost:3000 -t 60000
        env:
          NEWSLETTER_USERNAME: ci-not-a-real-list
      - name: assert again, where the dev warnings live
        run: npm run test:deck
        env:
          FIDELITY_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: deck-report, path: playwright-report/, retention-days: 14 }

  # ---------------------------------------------------------------- fidelity
  # Rule 3: every ported view is compared against the frozen prototype. The
  # baselines were captured on this same runner image with this same pinned
  # browser; that is why the comparison never runs on a laptop.
  fidelity:
    name: fidelity vs. prototype
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }
      - name: serve the exported site
        run: npm start & npx wait-on http://localhost:4173 -t 30000
      - name: compare
        run: npm run fidelity:app
        env:
          FIDELITY_BASE_URL: http://localhost:4173
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fidelity-diff, path: playwright-report/, retention-days: 14 }

  # Run by hand from the Actions tab. Captures the sixteen baselines from
  # docs/prototype.html and commits them, so the images in git were always made
  # by this runner and never by a machine with different fonts.
  baselines:
    name: capture baselines
    runs-on: ubuntu-latest
    if: ${{ inputs.capture_baselines }}
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run fidelity:baseline
      - name: commit them
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests/fidelity/baseline
          git diff --cached --quiet && echo 'baselines unchanged' && exit 0
          git commit -m 'Fidelity baselines captured from prototype-v0.4-final'
          git push

  # ------------------------------------------------ performance, on staging
  lighthouse:
    name: Lighthouse, mobile
    runs-on: ubuntu-latest
    needs: [build, fidelity]
    if: github.ref_name == 'staging'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: site, path: out }
      - name: serve the exported site
        run: npm start & npx wait-on http://localhost:4173 -t 30000
      # The home page, not an item page: which items exist depends on what is
      # published, so naming one here would fail the moment it is not.
      - name: Lighthouse, mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: http://localhost:4173/
          configPath: ./.github/lighthouse.json
          uploadArtifacts: true

  # ------------------------------------------------------- release, on prod
  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build, fidelity]
    if: github.ref_name == 'prod'
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm }
      - run: npm ci
      # The corrections page is the public record of what changed and when. It
      # is rendered from the history of data/, so it cannot drift from reality.
      - name: regenerate the corrections page
        run: node scripts/build-corrections.mjs || echo 'corrections generator lands in W4'
